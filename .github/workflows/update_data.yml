name: Auto-Update Gaming Data

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  update-data:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================
      # DROPS
      # ==========================================

      - name: Mise à jour automatique des Twitch Drops
        run: |
          python update_drops.py

      # ==========================================
      # JEUX
      # ==========================================

      - name: Mise à jour Steam + Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python update_games.py

      # ==========================================
      # VERIFICATION
      # ==========================================

      - name: Vérification des fichiers
        run: |
          python -m json.tool drops.json > /dev/null
          python -m json.tool games.json > /dev/null

          echo "=============================="
          echo "DROPS"
          echo "=============================="

          python - <<'PY'
          import json

          with open("drops.json", encoding="utf-8") as f:
              drops = json.load(f)

          live = [
              d for d in drops
              if d.get("status") == "live"
          ]

          upcoming = [
              d for d in drops
              if d.get("status") == "upcoming"
          ]

          print("Total:", len(drops))
          print("Actifs:", len(live))
          print("A venir:", len(upcoming))
          PY

      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit des données
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add games.json drops.json

          if git diff --cached --quiet; then

            echo "Aucune modification."

          else

            git commit \
              -m "Mise à jour automatique gaming data"

            git push

          fi
