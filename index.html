<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Trends Tracker - Top, Filtres & Favoris</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">
    
    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Barre de navigation / Liens rapides -->
        <nav class="flex flex-wrap justify-center gap-4 mb-8">
            <a href="https://www.twitch.tv/fire_bs2" target="_blank" 
               class="flex items-center gap-2 bg-purple-600/20 border border-purple-500/30 text-purple-400 hover:bg-purple-600/30 px-5 py-2.5 rounded-xl font-semibold transition-all duration-200 shadow-lg hover:scale-105">
                🔴 Ma Chaîne Twitch
            </a>
            <a href="https://shop-fire-zeta.vercel.app/" target="_blank" 
               class="flex items-center gap-2 bg-amber-500/20 border border-amber-500/30 text-amber-400 hover:bg-amber-500/30 px-5 py-2.5 rounded-xl font-semibold transition-all duration-200 shadow-lg hover:scale-105">
                🛒 Boutique Supercell
            </a>
        </nav>

        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400 mb-2">🎮 Gaming Trends Tracker</h1>
            <p class="text-slate-400 mb-1">Suivi en direct des tendances Steam et Twitch (Mise à jour automatique toutes les 30 min)</p>
            <p id="last-update" class="text-xs text-slate-500 mb-6">Dernière synchronisation : Chargement...</p>
            
            <div class="max-w-md mx-auto mb-6">
                <input type="text" id="search-input" placeholder="Rechercher un jeu (Brawl Stars, Pixel Gun 3D...)" 
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all duration-200 shadow-lg">
            </div>

            <!-- Filtres par plateforme et favoris fluides -->
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="setPlatformFilter('all')" id="filter-all" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white transition-all duration-200 shadow">Tous</button>
                <button onclick="setPlatformFilter('Twitch')" id="filter-twitch" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700 transition-all duration-200">Twitch</button>
                <button onclick="setPlatformFilter('Steam')" id="filter-steam" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700 transition-all duration-200">Steam</button>
                <button onclick="setPlatformFilter('favorites')" id="filter-fav" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-amber-400 border border-slate-800 hover:border-slate-700 transition-all duration-200">⭐ Favoris</button>
            </div>
        </header>

        <main class="bg-slate-900 border border-slate-800 rounded-xl shadow-xl overflow-hidden">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-200">Classement Global</h2>
                <span id="game-count" class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full">0 jeu</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm bg-slate-950/50">
                            <th class="py-4 px-4 text-center">⭐</th>
                            <th class="py-4 px-6 cursor-pointer hover:text-white transition" onclick="sortData('id')"># ↕</th>
                            <th class="py-4 px-6 cursor-pointer hover:text-white transition" onclick="sortData('name')">Jeu ↕</th>
                            <th class="py-4 px-6">Plateforme</th>
                            <th class="py-4 px-6 cursor-pointer hover:text-white transition" onclick="sortData('metric')">Volume ↕</th>
                            <th class="py-4 px-6 cursor-pointer hover:text-white transition" onclick="sortData('trend')">Tendance ↕</th>
                        </tr>
                    </thead>
                    <tbody id="games-table-body" class="divide-y divide-slate-800 text-sm transition-opacity duration-300">
                        <!-- Chargement -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let allGamesData = [];
        let currentFilter = 'all';
        let currentSearchQuery = '';
        let currentSortColumn = 'metric';
        let isAscending = false;
        let favorites = JSON.parse(localStorage.getItem('gaming_tracker_favs')) || [];

        function toggleFavorite(gameName, event) {
            event.stopPropagation();
            if (favorites.includes(gameName)) {
                favorites = favorites.filter(fav => fav !== gameName);
            } else {
                favorites.push(gameName);
            }
            localStorage.setItem('gaming_tracker_favs', JSON.stringify(favorites));
            applyFiltersAndRender();
        }

        function setPlatformFilter(filter) {
            currentFilter = filter;
            
            ['all', 'twitch', 'steam', 'fav'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (btn) {
                    btn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700 transition-all duration-200";
                }
            });
            
            const activeBtn = document.getElementById(`filter-${filter === 'favorites' ? 'fav' : filter.toLowerCase()}`);
            if (activeBtn) {
                activeBtn.className = filter === 'favorites' 
                    ? "px-4 py-1.5 rounded-lg text-sm font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40 transition-all duration-200 shadow"
                    : "px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white transition-all duration-200 shadow";
            }

            applyFiltersAndRender();
        }

        function sortData(column) {
            if (currentSortColumn === column) {
                isAscending = !isAscending;
            } else {
                currentSortColumn = column;
                isAscending = column === 'name';
            }
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            let data = [...allGamesData];

            if (currentFilter === 'Twitch' || currentFilter === 'Steam') {
                data = data.filter(game => game.platform === currentFilter);
            } else if (currentFilter === 'favorites') {
                data = data.filter(game => favorites.includes(game.name));
            }

            if (currentSearchQuery) {
                data = data.filter(game => game.name.toLowerCase().includes(currentSearchQuery));
            }

            data.sort((a, b) => {
                let valA = a[currentSortColumn];
                let valB = b[currentSortColumn];

                if (currentSortColumn === 'trend') {
                    valA = parseFloat(valA.replace('%', '').replace('+', '')) || 0;
                    valB = parseFloat(valB.replace('%', '').replace('+', '')) || 0;
                }

                if (typeof valA === 'string') {
                    return isAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return isAscending ? valA - valB : valB - valA;
                }
            });

            const tbody = document.getElementById('games-table-body');
            tbody.style.opacity = '0';
            setTimeout(() => {
                renderTable(data);
                tbody.style.opacity = '1';
            }, 150);
        }

        function renderTable(dataToDisplay) {
            const tbody = document.getElementById('games-table-body');
            tbody.innerHTML = '';
            
            document.getElementById('game-count').innerText = `${dataToDisplay.length} jeu${dataToDisplay.length > 1 ? 's' : ''}`;

            if (dataToDisplay.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-500">Aucun jeu trouvé. Vérifiez que votre fichier games.json contient bien des données.</td></tr>`;
                return;
            }

            dataToDisplay.forEach((game, index) => {
                const isFav = favorites.includes(game.name);
                const starColor = isFav ? 'text-amber-400 fill-amber-400' : 'text-slate-600 hover:text-slate-400';
                const trendColor = game.trend.startsWith('+') ? 'text-emerald-400' : 'text-rose-400';
                const platformBadge = game.platform === 'Twitch' 
                    ? '<span class="bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2.5 py-1 rounded-full text-xs font-semibold">Twitch</span>'
                    : '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-full text-xs font-semibold">Steam</span>';

                const row = `
                    <tr class="hover:bg-slate-800/50 transition-colors duration-150">
                        <td class="py-4 px-4 text-center align-middle">
                            <button onclick="toggleFavorite('${game.name.replace(/'/g, "\\'")}', event)" class="p-1 transition focus:outline-none">
                                <svg class="w-5 h-5 ${starColor} transition transform hover:scale-110" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                </svg>
                            </button>
                        </td>
                        <td class="py-4 px-6 font-medium text-slate-400 align-middle">${game.id || index + 1}</td>
                        <td class="py-4 px-6 flex items-center gap-4 align-middle">
                            <img src="${game.image}" alt="${game.name}" 
                                 onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&h=400&fit=crop'"
                                 class="w-16 h-20 object-cover rounded shadow border border-slate-700">
                            <div>
                                <span class="font-semibold text-white text-base block">${game.name}</span>
                                <span class="text-xs text-slate-400">${game.metric_label}</span>
                            </div>
                        </td>
                        <td class="py-4 px-6 align-middle">${platformBadge}</td>
                        <td class="py-4 px-6 font-mono font-bold align-middle">${game.metric.toLocaleString()}</td>
                        <td class="py-4 px-6 font-bold ${trendColor} align-middle">${game.trend}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        fetch('games.json?' + new Date().getTime())
            .then(response => {
                const lastModified = response.headers.get('Last-Modified');
                if (lastModified) {
                    const date = new Date(lastModified);
                    document.getElementById('last-update').innerText = `Dernière synchronisation : ${date.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})} (${date.toLocaleDateString('fr-FR')})`;
                } else {
                    document.getElementById('last-update').innerText = `Synchronisation automatique active`;
                }
                return response.json();
            })
            .then(data => {
                allGamesData = data;
                applyFiltersAndRender();
            })
            .catch(error => {
                console.error('Erreur :', error);
                document.getElementById('last-update').innerText = `Erreur lors du chargement des données`;
            });

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentSearchQuery = e.target.value.toLowerCase().trim();
            applyFiltersAndRender();
        });
    </script>
</body>
</html>
