<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Trends Tracker - Top 100 & Recherche</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    
    <div class="max-w-4xl mx-auto px-4 py-12">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400 mb-2">🎮 Gaming Trends Tracker</h1>
            <p class="text-slate-400 mb-6">Suivi en direct des tendances Steam et Twitch</p>
            
            <div class="max-w-md mx-auto">
                <input type="text" id="search-input" placeholder="Rechercher un jeu (ex: Brawl Stars, Fortnite...)" 
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-lg">
            </div>
        </header>

        <main class="bg-slate-900 border border-slate-800 rounded-xl shadow-xl overflow-hidden">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-200">Classement Global</h2>
                <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full">Top 100 en direct</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm bg-slate-950/50">
                            <th class="py-4 px-6">#</th>
                            <th class="py-4 px-6">Jeu</th>
                            <th class="py-4 px-6">Plateforme</th>
                            <th class="py-4 px-6">Volume</th>
                            <th class="py-4 px-6">Tendance</th>
                        </tr>
                    </thead>
                    <tbody id="games-table-body" class="divide-y divide-slate-800 text-sm">
                        <!-- Chargement -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let allGamesData = [];

        function renderTable(dataToDisplay) {
            const tbody = document.getElementById('games-table-body');
            tbody.innerHTML = '';
            
            if (dataToDisplay.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500">Aucun jeu trouvé</td></tr>`;
                return;
            }

            dataToDisplay.forEach((game, index) => {
                const trendColor = game.trend.startsWith('+') ? 'text-emerald-400' : 'text-rose-400';
                const platformBadge = game.platform === 'Twitch' 
                    ? '<span class="bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2.5 py-1 rounded-full text-xs font-semibold">Twitch</span>'
                    : '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-full text-xs font-semibold">Steam</span>';

                const row = `
                    <tr class="hover:bg-slate-800/50 transition">
                        <td class="py-4 px-6 font-medium text-slate-400 align-middle">${index + 1}</td>
                        <td class="py-4 px-6 flex items-center gap-4 align-middle">
                            <img src="${game.image}" alt="${game.name}" 
                                 onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&h=400&fit=crop'"
                                 class="w-20 h-24 object-cover rounded shadow border border-slate-700">
                            <div>
                                <span class="font-semibold text-white text-base block">${game.name}</span>
                                <span class="text-xs text-slate-400">${game.metric_label}</span>
                            </div>
                        </td>
                        <td class="py-4 px-6 align-middle">${platformBadge}</td>
                        <td class="py-4 px-6 font-mono font-bold align-middle">${game.metric.toLocaleString()}</td>
                        <td class="py-4 px-6 font-bold ${trendColor} align-middle">${game.trend}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        fetch('games.json')
            .then(response => response.json())
            .then(data => {
                allGamesData = data;
                renderTable(allGamesData);
            })
            .catch(error => {
                console.error('Erreur :', error);
            });

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allGamesData.filter(game => game.name.toLowerCase().includes(query));
            renderTable(filtered);
        });
    </script>
</body>
</html>
